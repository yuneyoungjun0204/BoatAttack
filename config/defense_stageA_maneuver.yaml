behaviors:
  Defence:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.000113
      beta: 0.00115
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 20
    max_steps: 25000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 500000
  Commander:
    trainer_type: ppo
    max_steps: 1
    hyperparameters:
      batch_size: 8
      buffer_size: 16
    network_settings:
      normalize: false
      hidden_units: 32
      num_layers: 1
engine_settings:
  time_scale: 1
  target_frame_rate: -1
  no_graphics: false
