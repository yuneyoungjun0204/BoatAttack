behaviors:
  Defence:
    trainer_type: poca
    hyperparameters:
      learning_rate: 0.0002
      batch_size: 1024
      buffer_size: 20480
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 50000
    # init_path: results/phase1_run/Defence  # Phase1 체크포인트에서 warm-start 원할 때 활성화
checkpoint_settings:
  run_id: chase_trap_v1
engine_settings:
  time_scale: 10
  num_envs: 4
