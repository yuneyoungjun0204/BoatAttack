behaviors:
  # Defence: POCA + Self-Play
  Defence:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    max_steps: 25000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 500000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 20000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

  # Attack: PPO + Self-Play
  Attack:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    max_steps: 25000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 500000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 20000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

engine_settings:
  time_scale: 1
  target_frame_rate: -1
  no_graphics: false

checkpoint_settings:
  run_id: defense_selfplay_v1
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false
