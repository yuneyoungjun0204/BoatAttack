behaviors:
  Defence:
    trainer_type: ppo
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: linear
      batch_size: 1024
      buffer_size: 10240
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
    checkpoint_interval: 50000
  Commander:
    trainer_type: ppo

    hyperparameters:
      learning_rate: 0.0001
      learning_rate_schedule: linear
      batch_size: 512
      buffer_size: 5120
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
checkpoint_settings:
  run_id: defense_boat_v1
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false
