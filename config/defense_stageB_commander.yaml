behaviors:
  Defence:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1
    time_horizon: 64
    summary_freq: 10000
  Commander:
    trainer_type: ppo
    hyperparameters:
      learning_rate: 0.0001
      learning_rate_schedule: linear
      batch_size: 128
      buffer_size: 1280
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 32
    summary_freq: 2000
    checkpoint_interval: 10000
engine_settings:
  time_scale: 10
  no_graphics: false
checkpoint_settings:
  run_id: stageB_commander_v1
  force: false
  train_model: true
  inference: false
